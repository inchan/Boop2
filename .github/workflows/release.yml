name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual rerun'
        required: false
        default: 'Manual rerun after fixing CI failure'

# Prevent concurrent releases and allow cancellation of in-progress runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail fast - exit on any error
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # Pre-flight validation before building
  validate:
    name: Pre-flight Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Check Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Validate version consistency
        run: |
          FRONTEND_VERSION=$(grep '"version"' package.json | head -1 | grep -oP '"\K[0-9]+\.[0-9]+\.[0-9]+')
          TAURI_VERSION=$(grep '"version"' src-tauri/tauri.conf.json | grep -oP '"\K[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$FRONTEND_VERSION" != "$TAURI_VERSION" ]; then
            echo "Version mismatch: package.json ($FRONTEND_VERSION) != tauri.conf.json ($TAURI_VERSION)"
            exit 1
          fi
          echo "✅ Versions validated: $FRONTEND_VERSION"

      - name: Report validation success
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            --state success \
            --description "Pre-flight validation passed" \
            --target-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true

  build:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: true # Stop all builds if any fails
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            asset_name: 'Boop2_universal.app.tar.gz'
          - platform: 'ubuntu-22.04'
            args: ''
            asset_name: 'Boop2_amd64.AppImage'
          - platform: 'windows-latest'
            args: ''
            asset_name: 'Boop2_x64-setup.exe'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report build started
        if: always()
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            --state pending \
            --description "Building for ${{ matrix.platform }}..." \
            --target-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ matrix.job }}" \
            || true

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build and release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Boop2 v__VERSION__'
          releaseBody: |
            ## What's Changed
            See the assets below to download and install this version.

            ### Installation
            - **macOS**: Download the `.dmg` file
            - **Linux**: Download the `.AppImage` or `.deb` file
            - **Windows**: Download the `.msi` installer

            ---
            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: false

      - name: Verify asset was uploaded
        id: verify-asset
        run: |
          TAG="${{ github.ref_name }}"
          ASSET="${{ matrix.asset_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" | grep -q "$ASSET"; then
            echo "✅ $ASSET uploaded successfully"
          else
            echo "❌ $ASSET not found in release"
            exit 1
          fi

      - name: Report build success
        if: always() && success()
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            --state success \
            --description "Build succeeded for ${{ matrix.platform }}" \
            || true

      - name: Report build failure
        if: always() && failure()
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            --state failure \
            --description "Build FAILED for ${{ matrix.platform }}" \
            --target-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ matrix.job }}" \
            || true

          echo ""
          echo "=========================================="
          echo "❌ BUILD FAILED: ${{ matrix.platform }}"
          echo "=========================================="
          echo ""
          echo "To retry after fixing the issue:"
          echo "1. Push a fix to your branch"
          echo "2. Or manually rerun from GitHub Actions:"
          echo "   https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          exit 1

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.sig
            src-tauri/target/**/release/bundle/**/*.tar.gz
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*-setup.exe
          if-no-files-found: error

  # Merge updater JSON after all builds complete
  merge-updater:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get release info
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create merged latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Get signatures from release assets
          REPO="${GITHUB_REPOSITORY}"
          TAG="${GITHUB_REF_NAME}"

          # Fetch signatures
          MACOS_SIG=$(curl -sL "https://github.com/${REPO}/releases/download/${TAG}/Boop2_universal.app.tar.gz.sig" | cat)
          LINUX_SIG=$(curl -sL "https://github.com/${REPO}/releases/download/${TAG}/Boop2_${VERSION}_amd64.AppImage.sig" | cat)
          WINDOWS_SIG=$(curl -sL "https://github.com/${REPO}/releases/download/${TAG}/Boop2_${VERSION}_x64-setup.exe.sig" | cat)

          # Create latest.json with all platforms
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See the release notes at https://github.com/${REPO}/releases/tag/${TAG}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-universal": {
                "signature": "${MACOS_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/Boop2_universal.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${MACOS_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/Boop2_universal.app.tar.gz"
              },
              "darwin-aarch64": {
                "signature": "${MACOS_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/Boop2_universal.app.tar.gz"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/Boop2_${VERSION}_amd64.AppImage"
              },
              "linux-x86_64-appimage": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/Boop2_${VERSION}_amd64.AppImage"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/Boop2_${VERSION}_x64-setup.exe"
              },
              "windows-x86_64-nsis": {
                "signature": "${WINDOWS_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/Boop2_${VERSION}_x64-setup.exe"
              }
            }
          }
          EOF

          cat latest.json

      - name: Upload latest.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing latest.json if exists
          gh release delete-asset "${GITHUB_REF_NAME}" latest.json --yes --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true

          # Upload new latest.json
          gh release upload "${GITHUB_REF_NAME}" latest.json --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Final status check
        run: |
          TAG="${{ github.ref_name }}"
          echo ""
          echo "=========================================="
          echo "✅ RELEASE COMPLETE: v${{ steps.release.outputs.version }}"
          echo "=========================================="
          echo ""
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          echo ""
          gh release view "${TAG}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
