name: Claude Code

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened]

# 같은 이슈/PR에 대해 중복 실행 방지
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    # 조건:
    # 1. 봇이 아닌 사용자
    # 2. 권한 있는 사용자 (OWNER, MEMBER, COLLABORATOR)
    # 3. @claude 멘션 포함 (대소문자 무시)
    if: |
      github.event.sender.type != 'Bot' &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR' ||
        github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR'
      ) &&
      (
        (github.event_name == 'issue_comment' && contains(toLower(github.event.comment.body), '@claude')) ||
        (github.event_name == 'issues' && contains(toLower(github.event.issue.body), '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(toLower(github.event.comment.body), '@claude')) ||
        (github.event_name == 'pull_request' && contains(toLower(github.event.pull_request.body), '@claude'))
      )
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          use_oauth: true
          timeout_minutes: "60"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
