name: Claude Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-response:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.sender.type == 'User'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          custom_instructions: |
            작업 완료 후 반드시 다음 순서를 따르세요:

            1. 자기반성리뷰: 작성한 코드를 검토하고 버그, 보안 취약점, 코드 품질 문제를 확인합니다
            2. 테스트: npm run test:ci 명령을 실행합니다
            3. 검증: 빌드가 정상적으로 되는지 확인합니다 (npm run build)
            4. 모든 검증이 통과하면:
               - 변경사항을 커밋합니다
               - 브랜치를 원격에 푸시합니다
               - main 브랜치를 base로 하는 Pull Request를 생성합니다
               - PR 설명에 변경사항 요약과 테스트 결과를 포함합니다

            테스트나 빌드가 실패하면 문제를 수정하고 다시 검증합니다.
